name: airflow
# Só para prod (atb). O deploy/build_prod.sh põe este arquivo no lugar do
# docker-compose.override.yml de dev. Como em dev, o código é lido do disco: o
# Astro monta dags/, include/ (my_ingestion) e plugins/ de /srv/airflow, e este
# arquivo acrescenta o my_analytics e o lake. Por isso um deploy de código só faz
# rsync; restart (rebuild) só quando muda imagem, config ou .env (deploy/estado.sh).
#
# ${BIND_IP} e ${AIRFLOW_PORT} são interpolados do ambiente do processo, não do
# .env: suba sempre com ./start.sh.
x-volumes: &volumes
  # /srv/lake/buckets = buckets do SeaweedFS montados por FUSE (serviço seaweedfs-mount
  # do homelab). Se o seaweedfs-mount reiniciar, reinicie o Airflow (Run workflow com restart): o bind
  # guarda o mount antigo.
  - /srv/lake/buckets:/usr/local/airflow/mylake:rslave
  # Projeto dbt, mesmo alvo do dev. dbt_packages/ é instalado ali pelo passo
  # "dbt deps" do workflow (docker exec), quando o package-lock.yml muda.
  - ./dbt/my_analytics:/usr/local/airflow/dbt/my_analytics

services:
  api-server:
    ports: !override
      - "${BIND_IP}:${AIRFLOW_PORT}:8080"
      # O astro dev start/restart confere a saúde em http://localhost:<porta>; sem
      # este bind ele sempre estoura o --wait e sai com erro, mesmo com tudo de pé.
      # 127.0.0.1 não fere a regra de ouro (nada em 0.0.0.0).
      - "127.0.0.1:${AIRFLOW_PORT}:8080"
    environment:
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS=False
      - AIRFLOW__API__BASE_URL=http://${BIND_IP}:${AIRFLOW_PORT}
    volumes:
      - ./simple_auth_manager_passwords.json.generated:/usr/local/airflow/simple_auth_manager_passwords.json.generated
    networks:
      - default
      - homelab-net

  scheduler:
    # root como em dev: as tasks gravam no lake com o dono que o FUSE mostrar.
    user: root
    environment:
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS=False
      - AIRFLOW__API__BASE_URL=http://${BIND_IP}:${AIRFLOW_PORT}
      - AIRFLOW__DAG_PROCESSOR__DAGBAG_IMPORT_TIMEOUT=120
    volumes: *volumes
    networks:
      - default
      - homelab-net

  dag-processor:
    user: root
    environment:
      - AIRFLOW__DAG_PROCESSOR__DAGBAG_IMPORT_TIMEOUT=120
      # Procura arquivos novos em dags/ a cada 60 s (padrão 300): DAG nova chega
      # por rsync, sem restart, e o verify_prod.sh espera por ela.
      - AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL=60
    volumes: *volumes
    networks:
      - default
      - homelab-net

  triggerer:
    networks:
      - default
      - homelab-net

  # Chrome remoto dos pipelines solar e fundos_imobiliarios
  # (SELENIUM_REMOTE_URL=http://selenium:4444/wd/hub). Sem porta publicada.
  selenium:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    restart: unless-stopped

networks:
  homelab-net:
    external: true
