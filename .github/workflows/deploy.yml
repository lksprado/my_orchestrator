name: Deploy prod

# main é produção: todo merge na main deste repo, do my_ingestion ou do
# my_analytics publica a ponta dos três repos no Airflow do atb. Os outros dois repos
# disparam este workflow por repository_dispatch (event_type: deploy).
#
# Roda no self-hosted runner do atb (label atb-airflow, usuário github-runner):
# o atb só é alcançável pela Tailscale. Nada de credencial fica no servidor: o
# my_ingestion (privado) é lido com o secret INGESTION_READ_TOKEN só durante o job.
#
# O deploy normal é só rsync: DAGs, my_ingestion e dbt são lidos do disco pelos
# binds. Restart (rebuild da imagem) só quando o deploy/estado.sh vê mudança em
# imagem, config dos containers, plugins ou .env; dbt deps só quando muda o
# package-lock.yml do my_analytics.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      restart:
        description: 'Forçar restart (rebuild) mesmo sem mudança detectada'
        type: boolean
        default: false

run-name: >-
  Deploy prod (${{ github.event_name == 'repository_dispatch'
  && format('{0}@{1}', github.event.client_payload.repo, github.event.client_payload.sha)
  || github.event_name }})

concurrency:
  group: deploy-airflow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy no atb
    runs-on: [self-hosted, atb-airflow]
    timeout-minutes: 30
    steps:
      - name: Checkout my_orchestrator
        uses: actions/checkout@v4
        with:
          ref: main
          path: repos/my_orchestrator

      - name: Checkout my_ingestion
        uses: actions/checkout@v4
        with:
          repository: lksprado/my_ingestion
          ref: main
          token: ${{ secrets.INGESTION_READ_TOKEN }}
          path: repos/my_ingestion

      - name: Checkout my_analytics
        uses: actions/checkout@v4
        with:
          repository: lksprado/my_analytics
          ref: main
          path: repos/my_analytics

      - name: Montar /srv/airflow
        env:
          DEPLOY_ORIGEM: ${{ github.event_name }} (run ${{ github.run_id }})
        run: repos/my_orchestrator/deploy/build_prod.sh repos/my_ingestion repos/my_analytics /srv/airflow/

      - name: Decidir restart e dbt deps
        id: estado
        env:
          FORCAR: ${{ inputs.restart || false }}
        run: |
          estado=repos/my_orchestrator/deploy/estado.sh
          restart=$($estado precisa restart)
          [ "$FORCAR" = "true" ] && restart=true
          deps=$($estado precisa dbt-deps)
          echo "restart=$restart" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy"
            echo "- restart (rebuild): **$restart**$([ "$FORCAR" = "true" ] && echo ' (forçado)')"
            echo "- dbt deps: **$deps**"
            echo
            head -2 /srv/airflow/DEPLOYED.txt | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "restart=$restart deps=$deps"

      - name: Rebuild e restart
        if: steps.estado.outputs.restart == 'true'
        run: |
          /srv/airflow/start.sh restart --wait 5m
          repos/my_orchestrator/deploy/estado.sh gravar restart

      - name: dbt deps
        if: steps.estado.outputs.deps == 'true'
        run: |
          scheduler=$(sudo docker ps -q \
            --filter label=com.docker.compose.project.working_dir=/srv/airflow \
            --filter label=com.docker.compose.service=scheduler)
          [ -n "$scheduler" ] || { echo "erro: scheduler não está rodando" >&2; exit 1; }
          sudo docker exec "$scheduler" bash -c \
            'cd /usr/local/airflow/dbt/my_analytics && /usr/local/airflow/dbt_venv/bin/dbt deps --project-dir . --profiles-dir . && rm -rf logs'
          repos/my_orchestrator/deploy/estado.sh gravar dbt-deps

      - name: Verificar
        run: repos/my_orchestrator/deploy/verify_prod.sh /srv/airflow
