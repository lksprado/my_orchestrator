name: PR

# Checagem rápida antes do merge, toda no runner do GitHub: sintaxe e se cada
# chave do .env de dev tem par em prod (config.env ou secret do environment prod).
# Import errors de verdade só aparecem com o Airflow e o my_ingestion juntos:
# quem pega é o deploy/verify_prod.sh, depois do merge.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe das DAGs e scripts
        run: |
          python3 -m py_compile dags/*.py include/utils/*.py deploy/*.py
          bash -n deploy/*.sh deploy/prod/start.sh

  env-prod:
    name: Chaves de dev x prod
    # Lê os secrets do environment prod (só os nomes saem do script). PR de fork não
    # recebe secrets: o job só roda para branch deste repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      # Falha listando a chave do .env.example que não tem secret (ou linha no
      # deploy/prod/config.env); secret sobrando só gera aviso. PR vermelho = crie
      # o secret antes do merge.
      - name: .env.example x config.env + secrets
        env:
          SEGREDOS: ${{ toJSON(secrets) }}
        run: deploy/checar_env.sh
